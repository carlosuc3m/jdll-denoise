[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jdll-denoise"
version = "0.1.0"
description = "Array-first classical and self-supervised microscopy denoising backend for JDLL"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "JDLL contributors"}]
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "scipy>=1.9",
  "scikit-image>=0.20",
  "tifffile>=2023.1",
  "imageio>=2.31",
]

[project.optional-dependencies]
bm = ["bm3d", "bm4d"]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["jdll_denoise"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["performance: warmed runtime comparisons requiring optional accelerator hardware"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
